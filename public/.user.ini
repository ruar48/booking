; Gallery photos may be up to 5 MB each, 10 per upload (see
; StoreGalleryPhotoRequest). PHP drops anything over upload_max_filesize before
; Laravel sees it, so the server limit must match. post_max_size covers a full
; batch of 10 plus the form fields. Read by PHP-FPM/CGI hosts (e.g. Hostinger);
; ignored elsewhere. Changes can take up to user_ini.cache_ttl (5 min) to apply.
upload_max_filesize = 5M
post_max_size = 60M
